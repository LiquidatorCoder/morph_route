name: morph_route
description: >-
  iOS 26-inspired container morph for Flutter. A modified OpenContainer with
  backdrop blur, accent scrim, 3D tilt, and a scaffold-level recede helper —
  drop-in widgets to make any tile-to-screen navigation feel premium.
version: 0.0.1+1

# TODO: replace <username> with the GitHub user/org once the repo is pushed.
homepage: https://github.com/abhaymaurya/morph_route
repository: https://github.com/abhaymaurya/morph_route
issue_tracker: https://github.com/abhaymaurya/morph_route/issues

topics:
  - animation
  - transition
  - navigation
  - container-transform
  - ios

environment:
  sdk: ^3.11.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
