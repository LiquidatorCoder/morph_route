name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format · analyze · test · publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: pub get
        run: |
          flutter pub get
          (cd example && flutter pub get)
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (package)
        run: flutter analyze
      - name: Analyze (example)
        working-directory: example
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "no test/ directory"; fi
      - name: Publish dry-run
        run: flutter pub publish --dry-run

  ios-e2e:
    name: iOS simulator e2e
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Integration tests (prints PERF lines)
        working-directory: example
        # Explicit `shell: bash` adds -o pipefail, so a failing test isn't masked by `tee`.
        shell: bash
        run: flutter test integration_test -d "$SIM_UDID" | tee e2e.log
      - name: Perf summary
        if: always()
        working-directory: example
        run: grep '^PERF ' e2e.log >> "$GITHUB_STEP_SUMMARY" || true
