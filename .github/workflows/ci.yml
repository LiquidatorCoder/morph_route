name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format · analyze · test · publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: pub get
        run: |
          flutter pub get
          (cd example && flutter pub get)
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (package)
        run: flutter analyze
      - name: Analyze (example)
        working-directory: example
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "no test/ directory"; fi
      - name: Publish dry-run
        run: flutter pub publish --dry-run
